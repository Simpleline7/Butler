      <div class="detail-section">
        <div class="detail-label">Tags</div>
        <div class="tags-wrap">
          ${tagsHtml}
          <input class="add-tag-input" placeholder="+ tag"
            onkeydown="if(event.key==='Enter'||event.key===','){if(this.value.trim()){addTagToTask('${t.id}',this.value);this.value=''}}"/>
        </div>
      </div>
      <div class="detail-section">
        <div class="detail-label">Notes</div>
        <textarea class="detail-input notes-input"
          onblur="updateTaskSilent('${t.id}','notes',this.value);scheduleRender()"
          placeholder="Add notes…">${escHtml(t.notes||'')}</textarea>
      </div>
    </div>
    <div class="detail-footer">
      <button class="delete-btn" onclick="trashTask('${t.id}')">🗑 Delete</button>
      <span class="created-at">Created ${new Date(t.createdAt).toLocaleDateString()}</span>
    </div>
  </div>`;
}

// When a task action (complete, subtask, tag) updates the selected task,
// rebuild the detail panel with fresh data
function refreshDetail() {
  const root = document.getElementById('detail-root');
  if (!root || !state.selectedTask || state.rightPanel !== 'detail') return;
  root.dataset.taskId = ''; // force rebuild
  renderDetailInPlace();
}

// ── Modals: isolated from main render() ──────────────────────────────────
// Process modal and Routine modal live in a persistent body-level container
// so render() never destroys them mid-interaction
function renderModalInPlace() {
  let root = document.getElementById('modal-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'modal-root';
    document.body.appendChild(root);
  }

  const routineHtml = renderRoutineModal();
  const processHtml = buildProcessModalHtml();

  // Only rebuild if something changed — compare a simple signature
  const sig = (state.modalType||'') + (state.routineModal ? state.routineModal.mode + JSON.stringify(state.routineModal.routine?.freq) : '');
  if (root.dataset.sig === sig && !routineHtml && !processHtml) {
    root.innerHTML = '';
    return;
  }
  root.dataset.sig = sig;

  if (routineHtml) { root.innerHTML = routineHtml; return; }
  if (processHtml) { root.innerHTML = processHtml; return; }
  root.innerHTML = '';
}

function buildProcessModalHtml() {
  if (state.modalType !== 'processTask' || !state.processTask) return '';
  const p = state.processTask;
  const task = state.tasks.find(t => t.id === p.taskId);
  const listOptions = state.lists.map(l=>`<option value="${l.id}"${p.listId===l.id?' selected':''}>${l.icon} ${escHtml(l.name)}</option>`).join('');
  const priBtns = PRIORITIES.map(px=>`<button id="ppri_${px.val}" class="p-btn${p.priority===px.val?' active-p':''}" style="color:${px.color}" onclick="processSetPriority(${px.val})">${px.label}</button>`).join('');
  return `<div class="modal-overlay" onclick="setModalType(null)">
    <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div class="modal-title" style="margin-bottom:0">Process</div>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:14px">Move this out of your Inbox. Schedule it, save as reference, or convert to a recurring routine.</div>
      <div style="background:var(--bg3);border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px;font-weight:500;color:var(--text2)">${escHtml(task?.title||'')}</div>

      <div class="detail-label">Move to List <span style="color:var(--red)">*</span></div>
      <select class="modal-input" style="margin-bottom:14px" onchange="state.processTask={...state.processTask,listId:this.value}">
        <option value="">— Choose a list —</option>
        ${listOptions}
      </select>

      <div class="detail-label">Due Date <span style="color:var(--text3);font-weight:400;font-style:italic">(optional)</span></div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input type="date" class="modal-input" id="processDueDateInput" style="margin-bottom:0;flex:1" value="${p.dueDate||''}" oninput="state.processTask={...state.processTask,dueDate:this.value}"/>
        <input type="time" class="modal-input" style="margin-bottom:0;width:110px" value="${p.dueTime||''}" oninput="state.processTask={...state.processTask,dueTime:this.value}"/>
      </div>

      <div class="detail-label">Priority</div>
      <div class="priority-row" style="margin-bottom:18px">${priBtns}</div>

      <div style="border-top:1px solid var(--border);padding-top:14px;margin-bottom:18px">
        <div style="font-size:11.5px;color:var(--text3);margin-bottom:8px;font-style:italic">Does this repeat regularly?</div>
        <button onclick="convertTaskToRoutine('${p.taskId}')"
          style="width:100%;padding:9px 14px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:'Jost',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s"
          onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
          onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--text2)'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17,1 21,5 17,9"/><path d="M3,11V9a4,4,0,0,1,4-4h14"/><polyline points="7,23 3,19 7,15"/><path d="M21,13v2a4,4,0,0,1-4,4H3"/></svg>
          Convert to Routine
        </button>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="setModalType(null)">Cancel</button>
        <button class="btn-primary" onclick="confirmProcessTask()" style="padding:8px 20px">${p.dueDate ? 'Schedule ✓' : 'Save as Reference ✓'}</button>
      </div>
    </div>
  </div>`;
}

window.processSetPriority = function(val) {
  state.processTask = {...state.processTask, priority: val};
  document.querySelectorAll('[id^="ppri_"]').forEach(btn => {
    const bval = parseInt(btn.id.replace('ppri_',''));
    btn.classList.toggle('active-p', bval === val);
  });
};

// ── PWA Install ──────────────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  state.deferredInstall = e;
  state.showInstallBanner = true;
  render();
});
window.doInstall = function() {
  if(state.deferredInstall) {
    state.deferredInstall.prompt();
    state.deferredInstall.userChoice.then(()=>{ state.showInstallBanner=false; render(); });
  }
};
window.addEventListener('appinstalled', ()=>{ state.showInstallBanner=false; render(); });

// ── Service Worker ────────────────────────────────────────────────────────
if('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'butler-v1';
    const ASSETS = [self.location.href];
    self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS))));
    self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match(e.request)))));
  `;
  const swBlob = new Blob([swCode], {type:'text/javascript'});
  const swURL = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL).catch(()=>{});
}

// ── Routine planner drag-and-drop ─────────────────────────────────────────
let _dragRoutineId = null;
let _dragFromDay = null;

window.startDrag = function(e, routineId, fromDay) {
  _dragRoutineId = routineId;
  _dragFromDay = fromDay || null;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', routineId);
  setTimeout(() => { if (e.target) e.target.style.opacity = '0.4'; }, 0);
};

window.endDrag = function(e) {
  if (e.target) e.target.style.opacity = '';
  // Don't clear _dragRoutineId here — dropOnDay fires before dragend
};

window.dropOnDay = function(e, ds) {
  e.preventDefault();
  const id = _dragRoutineId || e.dataTransfer.getData('text/plain');
  if (!id) return;
  // planRoutineOnDay already removes from all other days first
  planRoutineOnDay(id, ds);
  _dragRoutineId = null;
  _dragFromDay = null;
};

window.unplanRoutine = unplanRoutine;

window.dropOnTray = function(e) {
  e.preventDefault();
  const id = _dragRoutineId || e.dataTransfer.getData('text/plain');
  if (!id) return;
  // Remove from all days this week — sends back to unscheduled tray
  const week = getWeekOf(state.plannerWeekOffset || 0);
  const plan = {...state.weeklyPlan};
  week.forEach(ds => {
    if (plan[ds]) plan[ds] = plan[ds].filter(rid => rid !== id);
  });
  state.weeklyPlan = plan;
  _dragRoutineId = null;
  _dragFromDay = null;
  persist(); render();
};

// ── Calendar drag-and-drop ────────────────────────────────────────────────
let calDragTaskId = null;

window.calDragStart = function(e, taskId) {
  calDragTaskId = taskId;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', taskId);
  setTimeout(() => { if (e.target) e.target.style.opacity = '0.4'; }, 0);
};

window.calDragEnd = function(e) {
  if (e.target) e.target.style.opacity = '';
  calDragTaskId = null;
};

window.calDropOnDay = function(e, ds) {
  e.preventDefault();
  const id = calDragTaskId || e.dataTransfer.getData('text/plain');
  if (!id) return;
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  const updates = { dueDate: ds };
  if (!task.listId) updates.listId = state.lists[0]?.id || null;
  state.tasks = state.tasks.map(t => t.id === id ? {...t, ...updates} : t);
  persist(); render();
  const label = new Date(ds+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  showToast(`📅 Scheduled for ${label}`);
};

window.calDropOnTray = function(e) {
  e.preventDefault();
  const id = calDragTaskId || e.dataTransfer.getData('text/plain');
  if (!id) return;
  state.tasks = state.tasks.map(t => t.id === id ? {...t, dueDate:'', dueTime:''} : t);
  persist(); render();
  showToast('↩️ Moved back to unscheduled');
};

// ── Reminder / Notification System ───────────────────────────────────────
let notifPermission = 'default';
let reminderCheckInterval = null;
const firedReminders = new Set(); // track which task+date combos already fired

function requestNotifPermission() {
  if (!('Notification' in window)) return;
  Notification.requestPermission().then(p => {
    notifPermission = p;
    if (p === 'granted') {
      showToast('🔔 Notifications enabled! Reminders will now work.');
      startReminderChecker();
    }
  });
}

function startReminderChecker() {
  if (reminderCheckInterval) clearInterval(reminderCheckInterval);
  reminderCheckInterval = setInterval(checkReminders, 30000); // check every 30s
  checkReminders(); // check immediately
}

function checkReminders() {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  const todStr = todayStr();
  const currentTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  state.tasks.forEach(t => {
    if (!t.reminder || t.completed || t.trashed) return;
    if (!t.dueDate) return;

    // Fire if reminder time matches current time on due date
    const fireKey = `${t.id}-${t.dueDate}-${t.reminder}`;
    if (firedReminders.has(fireKey)) return;

    const isToday = t.dueDate === todStr;
    const isFutureDate = t.dueDate > todStr;

    // Only fire reminders for today's tasks, or tasks due in the future on their due date
    if (!isToday && !isFutureDate) return;

    // For today: fire when clock matches reminder time
    if (isToday && currentTime === t.reminder) {
      firedReminders.add(fireKey);
      sendNotification(t);
    }
    // For future dates: fire at reminder time on the due date
    if (isFutureDate && t.dueDate === todStr && currentTime === t.reminder) {
      firedReminders.add(fireKey);
      sendNotification(t);
    }
  });
}

function sendNotification(task) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const list = state.lists.find(l => l.id === task.listId);
  const body = [
    task.dueTime ? `Due at ${fmtTime(task.dueTime)}` : `Due today`,
    list ? `${list.icon} ${list.name}` : '',
    task.notes ? task.notes.slice(0, 60) : ''
  ].filter(Boolean).join(' · ');

  const n = new Notification(`⏰ ${task.title}`, {
    body,
    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%23b5603a"/><ellipse cx="32" cy="17" rx="7" ry="8" fill="white"/><path d="M17 64 L23 36 L32 46 L41 36 L47 64Z" fill="white"/><path d="M24 35 L32 46 L40 35 L32 24Z" fill="%232c1810"/><ellipse cx="32" cy="35" rx="5" ry="4" fill="%232c1810"/></svg>',
    badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%23b5603a"/></svg>',
    tag: task.id,
    renotify: false,
  });
  n.onclick = () => { window.focus(); window.selectTask(task.id); n.close(); };
}

window.requestNotifPermission = requestNotifPermission;

// ── List editing ──────────────────────────────────────────────────────────
function openEditList(id) {
  const l = state.lists.find(l => l.id === id);
  if (!l) return;
  state.editListModal = {...l};
  state.modalType = 'editList';
  render();
  setTimeout(() => document.getElementById('editListName')?.focus(), 50);
}

function saveEditList() {
  const l = state.editListModal;
  if (!l || !l.name.trim()) return;
  state.lists = state.lists.map(li => li.id === l.id ? {...l, name: l.name.trim()} : li);
  state.editListModal = null;
  state.modalType = null;
  showToast('✏️ List updated');
  persist(); render();
}

function deleteList(id) {
  // Move tasks in this list back to unassigned
  state.tasks = state.tasks.map(t => t.listId === id ? {...t, listId: null} : t);
  state.lists = state.lists.filter(l => l.id !== id);
  if (state.selectedList === id) { state.selectedList = null; state.view = 'inbox'; }
  state.editListModal = null;
  state.modalType = null;
  showToast('🗑 List deleted · tasks moved to Inbox');
  persist(); render();
}

window.openEditList = openEditList;
window.saveEditList = saveEditList;
window.deleteList = deleteList;

// ── Routine modal handlers ────────────────────────────────────────────────
window.routineSetFreq = function(val) {
  if (!state.routineModal) return;
  state.routineModal = {...state.routineModal, routine: {
    ...state.routineModal.routine,
    freq: val,
    flexible: false,
    scheduledDays: val==='weekly' ? [1] : val==='weekdays' ? [1,2,3,4,5] : [],
  }};
  // Rebuild only the freqExtra section in-place — no full re-render
  const freqExtraEl = document.getElementById('routineFreqExtra');
  if (freqExtraEl) {
    freqExtraEl.innerHTML = buildFreqExtra(state.routineModal.routine);
  } else {
    scheduleRender();
  }
};

function buildFreqExtra(r) {
  let html = '';
  if (r.freq === 'daily' || r.freq === 'weekdays' || r.freq === 'weekly') {
    html += `<div id="routineFlexToggle" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg3);border-radius:10px;margin-bottom:10px;cursor:pointer;border:1px solid var(--border)" onclick="routineToggleFlexible()">
      <div>
        <div style="font-size:13px;font-weight:500">Flexible scheduling</div>
        <div id="routineFlexDesc" style="font-size:11.5px;color:var(--text3);margin-top:2px">${r.flexible?'Drag onto any day in the Weekly Planner':'Fixed to specific day(s)'}</div>
      </div>
      <div id="routineFlexTrack" style="width:38px;height:21px;border-radius:11px;background:${r.flexible?'var(--accent)':'var(--border2)'};position:relative;flex-shrink:0;transition:all .2s">
        <div id="routineFlexThumb" style="width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;top:2px;left:${r.flexible?'19px':'2px'};transition:all .2s;box-shadow:0 1px 3px #00000030"></div>
      </div>
    </div>`;
    if (r.freq === 'weekly' && !r.flexible) {
      html += `<div class="detail-label">Which day(s)?</div>
      <div id="routineDayPicker" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        ${DAY_NAMES.map((dn,i)=>{
          const on = (r.scheduledDays||[]).includes(i);
          return `<div id="rday_${i}" onclick="routineToggleDay(${i})" style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;background:${on?r.color:'var(--bg4)'};color:${on?'#fff':'var(--text3)'};transition:all .15s;border:1.5px solid ${on?r.color:'var(--border)'}">${dn.slice(0,2)}</div>`;
        }).join('')}
      </div>`;
    }
  }
  if (r.freq === 'interval') {
    const unitOpts = INTERVAL_UNITS.map(u=>`<option value="${u.val}"${(r.intervalUnit||'weeks')===u.val?' selected':''}>${u.label}</option>`).join('');
    html += `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px">
      <div class="detail-label" style="margin-bottom:8px">Repeat every…</div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="number" min="1" max="365" class="modal-input" style="margin-bottom:0;width:72px;text-align:center;font-size:18px;font-weight:600;padding:8px" value="${r.intervalVal||2}"
          oninput="state.routineModal={...state.routineModal,routine:{...state.routineModal.routine,intervalVal:parseInt(this.value)||1}}"/>
        <select class="modal-input" style="margin-bottom:0;flex:1" onchange="routineSetIntervalUnit(this.value)">${unitOpts}</select>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:10px;font-style:italic">e.g. wash curtains every 3 months, clean oven every 6 weeks</div>
    </div>
    <div style="margin-bottom:10px">
      <div class="detail-label">First due date</div>
      <input type="date" class="modal-input" style="margin-bottom:0" value="${r.startDate||todayStr()}"
        oninput="state.routineModal={...state.routineModal,routine:{...state.routineModal.routine,startDate:this.value}}"/>
      <div style="font-size:11.5px;color:var(--text3);margin-top:5px;font-style:italic">When should this first be due? After completing it, the next due date will be calculated automatically.</div>
    </div>`;
  }
  return html;
}

window.routineSetIntervalUnit = function(val) {
  if (!state.routineModal) return;
  state.routineModal = {...state.routineModal, routine: {...state.routineModal.routine, intervalUnit: val}};
};

window.routineSetField = function(field, val) {
  if (!state.routineModal) return;
  state.routineModal = {...state.routineModal, routine: {...state.routineModal.routine, [field]: val}};
};

window.routineSetPriority = function(val) {
  if (!state.routineModal) return;
  state.routineModal = {...state.routineModal, routine: {...state.routineModal.routine, priority: val}};
  // Update buttons in-place — no re-render
  document.querySelectorAll('[id^="rpri_"]').forEach(btn => {
    const bval = parseInt(btn.id.replace('rpri_',''));
    btn.classList.toggle('active-p', bval === val);
  });
};

window.routineSetColor = function(color) {
  if (!state.routineModal) return;
  state.routineModal = {...state.routineModal, routine: {...state.routineModal.routine, color}};
  // Update color swatches in-place
  const swatches = document.querySelectorAll('[id^="rcol_"]');
  swatches.forEach((el, i) => {
    const isActive = ROUTINE_COLORS[i] === color;
    el.style.border = `2px solid ${isActive ? 'var(--text)' : 'transparent'}`;
    el.style.transform = `scale(${isActive ? 1.2 : 1})`;
  });
  // Update the colour dot in modal header
  const dot = document.getElementById('routineColorDot');
  if (dot) dot.style.background = color;
  // Update day picker buttons to use new color
  const days = state.routineModal?.routine?.scheduledDays || [];
  days.forEach(i => {
    const el = document.getElementById(`rday_${i}`);
    if (el) { el.style.background = color; el.style.borderColor = color; }
  });
};

window.routineToggleFlexible = function() {
  if (!state.routineModal) return;
  const r = state.routineModal.routine;
  const newFlexible = !r.flexible;
  state.routineModal = {...state.routineModal, routine: {
    ...r, flexible: newFlexible,
    scheduledDays: newFlexible ? [] : [1]
  }};
  // Update toggle in-place
  const track = document.getElementById('routineFlexTrack');
  const thumb = document.getElementById('routineFlexThumb');
  const desc  = document.getElementById('routineFlexDesc');
  if (track) track.style.background = newFlexible ? 'var(--accent)' : 'var(--border2)';
  if (thumb) thumb.style.left = newFlexible ? '19px' : '2px';
  if (desc)  desc.textContent = newFlexible ? 'Drag onto any day in the Weekly Planner' : 'Fixed to specific day(s)';
  // Day picker only relevant for non-flexible weekly — rebuild freqExtra section only
  const freqExtraEl = document.getElementById('routineFreqExtra');
  if (freqExtraEl) freqExtraEl.innerHTML = buildFreqExtra(state.routineModal.routine);
};

window.routineToggleDay = function(i) {
  if (!state.routineModal) return;
  const days = [...(state.routineModal.routine.scheduledDays || [])];
  const idx = days.indexOf(i);
  if (idx >= 0) days.splice(idx, 1); else days.push(i);
  state.routineModal = {...state.routineModal, routine: {...state.routineModal.routine, scheduledDays: days}};
  // Update day button in-place
  const el = document.getElementById(`rday_${i}`);
  if (el) {
    const on = days.includes(i);
    const color = state.routineModal.routine.color;
    el.style.background = on ? color : 'var(--bg4)';
    el.style.color = on ? '#fff' : 'var(--text3)';
    el.style.borderColor = on ? color : 'var(--border)';
  }
};

// ── Init ──────────────────────────────────────────────────────────────────
runAutoCleanup();
render();
window.addEventListener('resize', render);

// Start notifications
if (typeof Notification !== 'undefined') {
  notifPermission = Notification.permission;
  if (notifPermission === 'granted') startReminderChecker();
  else if (notifPermission === 'default') {
    // Show a prompt after 2s so user isn't immediately bombarded
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);border-radius:12px;padding:12px 18px;font-size:13px;z-index:800;display:flex;align-items:center;gap:12px;box-shadow:0 4px 24px #00000040;white-space:nowrap;font-family:Jost,sans-serif';
      banner.innerHTML = `<span>🔔 Enable reminders for task notifications</span><button onclick="requestNotifPermission();this.parentElement.remove()" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:Jost,sans-serif">Enable</button><button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;cursor:pointer;font-size:16px;opacity:.6">✕</button>`;
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 8000);
    }, 2000);
  }
}
</script>
